<meta name="description" content="Track your Doreah Beauty order with your order number.">
<meta name="theme-color" content="#8c1c2a">

<body class="track-page">

<header class="site-header scrolled">
  <a href="index.html" class="back-link">← Shop</a>
  <a href="index.html" class="site-logo" aria-label="Doreah home">Doreah</a>
  <span class="back-link" aria-hidden="true" style="visibility:hidden">← Shop</span>
</header>

<main class="track-main">
  <div class="track-hero">
    <span class="section-tag">Order Status</span>
    <h1 class="section-title">Track Your <em>Order</em></h1>
    <p class="section-sub">Enter the order number from your WhatsApp message (it looks like <strong>DB-KX4F9-7QM</strong>).</p>
  </div>

  <form class="track-form" id="track-form" novalidate>
    <label class="sr-only" for="track-input">Order number</label>
    <input id="track-input" class="field" placeholder="DB-XXXXX-XXX" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="20">
    <button type="submit" class="btn btn-primary">Track</button>
  </form>

  <div class="recent-orders" id="recent-orders" hidden></div>

  <div id="track-result" aria-live="polite"></div>
</main>
